add_newline = false
format = '${custom.user}$all'

[time]
disabled = true

[line_break]
disabled = true

[gcloud]
disabled = true

[docker_context]
disabled = true

[git_status]
disabled = true

[package]
disabled = true

[cmd_duration]
min_time = 500

[aws]
symbol = ''

[python]
disabled = true
symbol = ''
style = "bold green"

[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style) in '
contexts = [
  { context_pattern = ".*qa.*", style = "yellow bold", symbol = "⚠️ " },
  { context_pattern = ".*prd.*", style = "red bold", symbol = "⚠️ " },
]

[helm]
disabled = false

[terraform]
disabled = false

[container]
disabled = true

[username]
disabled = true

# show the user unless it owns this checkout (i.e. it's me); checked per prompt so `su` works
[custom.user]
command = 'test -O "$TERMINAL_DIR" || id -un'
when = true
shell = ['sh']
format = '([$output]($style) in )'
style = 'bold yellow'

[hostname]
disabled = false
ssh_only = true
